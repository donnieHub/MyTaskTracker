name: Build and Test myTaskTracker

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**.kt'
      - '**.java'
      - '**.kts'
      - '.github/workflows/main.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '**.kt'
      - '**.java'
      - '**.kts'
      - '.github/workflows/main.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Настройка Gradle с автоматическим кэшированием (ускоряет сборку на 40-60%)
      # Это официальный и самый современный способ работы с Gradle в GitHub Actions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Сборка и запуск тестов
      # Если зависимости описаны в корне и применяются ко всем модулям, этой команды достаточно.
      # Она автоматически найдет модуль user-service и соберет его.
      - name: Build and Test with Gradle
        run: ./gradlew clean build

      # 5. Публикация отчета о тестах, если они упали.
      # Помогает быстро увидеть, какой именно тест сломался, не скачивая логи.
      - name: Publish Test Report
        if: failure()
        uses: mikepenz/action-junit-report@v4
        with:
          # Gradle сохраняет отчеты в этих директориях
          report_paths: '**/build/test-results/test/TEST-*.xml'